[package]
name = "android-computer-use-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Android computer-use MCP server for emulator control, observation, and artifact capture."
repository = "https://github.com/sednalabs/android-computer-use-mcp"
readme = "README.md"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.8"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.48", features = ["derive"] }
http = "1.3.1"
http-body-util = "0.1.3"
hyper = "1.7.0"
mcp-toolkit-core = { git = "https://github.com/sednalabs/mcp-toolkit-rs", rev = "1cf322071d84e27fe3002ee53198353af0ea6513", package = "mcp-toolkit-core" }
mcp-toolkit-http = { git = "https://github.com/sednalabs/mcp-toolkit-rs", rev = "1cf322071d84e27fe3002ee53198353af0ea6513", package = "mcp-toolkit-http", features = ["session"] }
rmcp = { version = "2.2.0", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1.2.0"
roxmltree = "0.21.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
tonic = { version = "0.14.5", features = ["transport"] }
tonic-prost = "0.14.5"
prost = "0.14.3"
prost-types = "0.14.1"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
mcp-toolkit-testing = { git = "https://github.com/sednalabs/mcp-toolkit-rs", rev = "1cf322071d84e27fe3002ee53198353af0ea6513", package = "mcp-toolkit-testing" }

[build-dependencies]
tonic-prost-build = "0.14.5"
