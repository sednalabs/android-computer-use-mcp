name: Lockfile Refresh Artifact

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lockfile-refresh-artifact.yml"

permissions:
  contents: read

jobs:
  refresh-lockfile:
    name: Resolve bounded lockfile updates
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Resolve approved package versions
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p anyhow --precise 1.0.104
          cargo update -p quinn-proto --precise 0.11.15
          mkdir -p dist/lockfile-refresh
          cp Cargo.lock dist/lockfile-refresh/Cargo.lock
          git diff -- Cargo.lock > dist/lockfile-refresh/Cargo.lock.patch
          test -s dist/lockfile-refresh/Cargo.lock.patch
          sha256sum Cargo.lock > dist/lockfile-refresh/Cargo.lock.sha256

      - name: Upload resolved lockfile evidence
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lockfile-refresh-${{ github.run_id }}
          path: dist/lockfile-refresh/**
          if-no-files-found: error
